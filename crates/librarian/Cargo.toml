[package]
name = "librarian"
version = "0.1.0"
edition = "2024"

[dependencies]
bookshelf-core = { path = "../bookshelf-core" }
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread", "time", "sync", "fs", "signal"] }
async-trait = "=0.1.92"
parking_lot = "=0.12.4"
quick-xml = "=0.41.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sqlx = { version = "=0.9.0", features = ["runtime-tokio", "postgres", "json", "time", "derive"] }
toml = "=1.1.4"
clap = { version = "=4.6.6", features = ["derive"] }
anyhow = "=1.0.104"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
tracing = "=0.1.44"
time = { version = "=0.3.55", features = ["formatting", "parsing", "macros"] }
url = "=2.5.8"
opentelemetry = { version = "=0.32.0", default-features = false, features = ["metrics", "trace"] }
opentelemetry_sdk = { version = "=0.32.1", default-features = false, features = ["metrics", "trace", "internal-logs"] }
opentelemetry-otlp = { version = "=0.32.0", default-features = false, features = [
    "metrics",
    "trace",
    "http-proto",
    "reqwest-blocking-client",
    "internal-logs",
] }


[features]
default = ["agent"]
agent = ["bookshelf-core/agent"]
[[bin]]
name = "librarian"
path = "src/main.rs"
