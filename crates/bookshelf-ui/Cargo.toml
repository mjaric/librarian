[package]
name = "bookshelf-ui"
version = "0.1.0"
edition = "2024"

# cdylib: the wasm bundle xtask feeds to wasm-bindgen; rlib: tests.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bookshelf-api = { path = "../bookshelf-api" }
leptos = { version = "=0.8.20", features = ["csr"] }
gloo-net = "=0.7.0"
gloo-timers = "=0.3.0"
serde = { version = "=1.0.229", features = ["derive"] }
wasm-bindgen = "=0.2.127"
leptos_router = "=0.8.15"
