[package]
name = "bookshelf-ui"
version = "0.1.0"
edition = "2024"

# cdylib: the wasm bundle xtask feeds to wasm-bindgen; rlib: tests.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bookshelf-api = { path = "../bookshelf-api" }
bookshelf-reader = { path = "../bookshelf-reader" }
leptos = { version = "=0.8.20", features = ["csr"] }
leptos_router = "=0.8.15"
leptos-use = "=0.19.0"
gloo-net = "=0.7.0"
gloo-timers = { version = "=0.3.0", features = ["futures"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
wasm-bindgen = "=0.2.127"
js-sys = "=0.3.104"
web-sys = { version = "=0.3.104", features = [
  "Window",
  "Document",
  "Storage",
  "Blob",
  "Url",
  "Element",
  "HtmlElement",
  "HtmlImageElement",
  "ScrollToOptions",
  "IntersectionObserver",
  "IntersectionObserverInit",
  "IntersectionObserverEntry",
  "console",
] }
