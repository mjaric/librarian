[package]
name = "bookshelf-core"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread", "time", "sync", "fs", "signal", "process", "io-util"] }
sqlx = { version = "=0.9.0", features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "migrate", "json", "time"] }
reqwest = { version = "=0.13.4", default-features = false, features = ["rustls", "gzip"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
quick-xml = "=0.41.0"
anyhow = "=1.0.104"
async-trait = "=0.1.92"
time = { version = "=0.3.55", features = ["formatting", "parsing", "macros"] }
libc = "=0.2.189"                       # PR_SET_PDEATHSIG child cleanup (Unix only)
tracing = "=0.1.44"
parking_lot = "=0.12.4"
url = "=2.5.8"

[features]
default = ["agent"]
agent = ["dep:rig-core"]

[dependencies.rig-core]
version = "=0.41.0"
optional = true
